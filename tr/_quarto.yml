project:
  type: book
  output-dir: _book

lang: tr

book:
  title: "Uygulamalı NLP"
  subtitle: "Token'lardan Ajanlara — mühendisler ve istatistikçiler için uygulamalı bir kurs"
  author: "Batu Bardak"
  date: today
  date-format: "MMMM YYYY"
  favicon: assets/favicon.svg
  site-url: https://bbardakk.github.io/metu-applied-nlp/tr
  repo-url: https://github.com/bbardakk/metu-applied-nlp
  repo-subdir: tr
  repo-actions: [edit, issue]
  search:
    location: sidebar
  page-navigation: true

  sidebar:
    style: docked
    collapse-level: 1
    tools:
      - icon: translate
        href: ../en/index.html
        text: "English edition"

  page-footer:
    left: |
      © 2026 Batu Bardak · Metin [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/), kod MIT.
    right:
      - text: "English"
        href: ../en/index.html

  chapters:
    - index.qmd
    - part: "Bölüm I — Temeller"
      chapters:
        - chapters/01-neden-nlp.qmd
    - references.qmd

# Tek kaynak: kaynakça İngilizce sürümle paylaşılır, kopyalanmaz.
bibliography: ../en/references.bib

format:
  html:
    theme:
      light: [cosmo, theme/custom-light.scss]
      dark: [darkly, theme/custom-dark.scss]
    toc: true
    toc-title: "Bu sayfada"
    code-copy: true
    link-external-newwindow: true
    smooth-scroll: true
    grid:
      sidebar-width: 300px
      body-width: 820px
      margin-width: 220px
