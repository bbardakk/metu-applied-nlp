project:
  type: book
  output-dir: _book

# ── Book structure ─────────────────────────────────────────────
# To add/remove/reorder chapters: edit the lists below, then create
# the .qmd file (copy _templates/chapter-template.qmd) or delete it.
book:
  title: "Applied NLP"
  subtitle: "From Tokens to Agents — a hands-on course for engineers and statisticians"
  author: "Batu Bardak"            # TODO: adjust name / add affiliation
  date: today
  date-format: "MMMM YYYY"
  favicon: assets/favicon.svg
  site-url: https://bbardakk.github.io/metu-applied-nlp/en
  repo-url: https://github.com/bbardakk/metu-applied-nlp
  repo-subdir: en
  repo-actions: [edit, issue]
  sharing: [twitter, linkedin]
  search:
    location: sidebar
  page-navigation: true

  sidebar:
    style: docked
    collapse-level: 1
    tools:
      - icon: translate
        href: ../tr/index.html
        text: "Türkçe sürüm"

  page-footer:
    left: |
      © 2026 Batu Bardak · Text [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/), code MIT.
    center: "Built with [Quarto](https://quarto.org)"
    right:
      - text: "Türkçe"
        href: ../tr/index.html
      - icon: github
        href: https://github.com/bbardakk/metu-applied-nlp

  chapters:
    - index.qmd
    - preface.qmd
    - part: "Part I — Foundations"
      chapters:
        - chapters/01-why-nlp-now.qmd
        - chapters/02-text-as-data.qmd
        - chapters/03-embeddings.qmd
        - chapters/04-bake-off.qmd
    - part: "Part II — Neural Language Models"
      chapters:
        - chapters/05-language-models.qmd
        - chapters/06-transformers.qmd
        - chapters/07-llm-landscape.qmd
    - part: "Part III — Working with LLMs"
      chapters:
        - chapters/08-prompting.qmd
        - chapters/09-rag.qmd
        - chapters/10-agents-tools.qmd
        - chapters/11-multimodal.qmd
        - chapters/12-evaluation.qmd
    - part: "Part IV — Production"
      chapters:
        - chapters/13-production.qmd
    - references.qmd

  appendices:
    - appendices/a-setup.qmd
    - appendices/b-math-refresher.qmd
    - appendices/c-glossary.qmd

  # ── Comments (giscus) ────────────────────────────────────────
  # 1) Make the GitHub repo public and enable Discussions.
  # 2) Install the giscus app on the repo: https://github.com/apps/giscus
  # 3) Get repo-id / category-id from https://giscus.app
  # 4) Uncomment below and fill in the values.
  #
  # comments:
  #   giscus:
  #     repo: bbardakk/metu-applied-nlp
  #     repo-id: "R_xxxxxxxx"
  #     category: "Comments"
  #     category-id: "DIC_xxxxxxxx"
  #     mapping: pathname
  #     reactions-enabled: true
  #     loading: lazy
  #     input-position: top

bibliography: references.bib

# Execute Python cells locally once; CI reuses the committed _freeze/
# results, so publishing never re-runs your notebooks.
execute:
  freeze: auto

format:
  html:
    theme:
      light: [cosmo, theme/custom-light.scss]
      dark: [darkly, theme/custom-dark.scss]
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    code-link: false
    link-external-newwindow: true
    smooth-scroll: true
    fig-align: center
    lightbox: true
    grid:
      sidebar-width: 300px
      body-width: 820px
      margin-width: 220px
