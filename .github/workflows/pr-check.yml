name: PR build check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      # The glossary tables are generated from glossary.csv, not hand-edited.
      - name: Check glossary is in sync with its CSV
        run: python3 scripts/build-glossary.py --check

      - name: Render English edition
        run: quarto render en

      - name: Render Turkish edition
        run: quarto render tr

      # A stale _freeze/ means the published site would not match the source.
      - name: Check for uncommitted freeze results
        run: |
          if [ -n "$(git status --porcelain -- '*/_freeze/*')" ]; then
            echo "::error::_freeze/ is out of date. Run 'quarto render en' locally and commit the changes."
            git status --porcelain -- '*/_freeze/*'
            exit 1
          fi
