name: Publish book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Only needed for cells not covered by the committed _freeze/ results.
      - name: Install Python deps
        run: pip install -r requirements.txt

      # The glossary tables are generated from glossary.csv, not hand-edited.
      - name: Check glossary is in sync with its CSV
        run: python3 scripts/build-glossary.py --check

      # Repeated from pr-check.yml on purpose: pushes land on main directly,
      # so the PR workflow is not a gate this book actually passes through.
      - name: Check cross-references, citations and chapter links
        run: python3 scripts/check-links.py

      - name: Check margin term-glosses resolve to the glossary
        run: python3 scripts/check-glossary-use.py

      - name: Render English edition
        run: quarto render en

      - name: Render Turkish edition
        run: quarto render tr

      - name: Assemble site
        run: |
          mkdir -p public
          cp -r en/_book public/en
          cp -r tr/_book public/tr
          cp index.html public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
